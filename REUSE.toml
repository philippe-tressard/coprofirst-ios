# SPDX-FileCopyrightText: 2026 Philippe TRESSARD
# SPDX-License-Identifier: AGPL-3.0-or-later WITH LicenseRef-CoproFirst-AppStore
#
# Conformité REUSE (standards/14 §6.2). Les fichiers qui portent leur en-tête SPDX
# n'ont rien à faire ici ; ne s'y déclarent que ceux qui ne le peuvent pas.
#
# Le LOGO de CoproFirst n'est pas encore dans ce dépôt. Le jour où il y entre (icône
# de l'app, écran d'accueil), chacun de ses fichiers se déclare ici sous
# `LicenseRef-CoproFirst-Logo` (hors de l'AGPL : MARQUE.md de coprofirst), et le
# texte de cette licence rejoint LICENSES/ — adapté pour nommer CE dépôt : celui de
# coprofirst ne couvre que les fichiers de coprofirst.
version = 1

# Le JSON n'admet pas de commentaire : l'en-tête ne peut pas y vivre.
[[annotations]]
path = [".claude/settings.json", ".swift-format", "Paquets/ClientAPI/Package.resolved"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Philippe TRESSARD"
SPDX-License-Identifier = "AGPL-3.0-or-later WITH LicenseRef-CoproFirst-AppStore"

# Le contrat de l'API, produit depuis le code de coprofirst (même auteur, seul
# titulaire des droits) par scripts/generer-openapi.sh — PROVENANCE-OPENAPI.md.
[[annotations]]
path = "Paquets/ClientAPI/Sources/ClientAPI/openapi.json"
precedence = "override"
SPDX-FileCopyrightText = "2026 Philippe TRESSARD"
SPDX-License-Identifier = "AGPL-3.0-or-later WITH LicenseRef-CoproFirst-AppStore"
