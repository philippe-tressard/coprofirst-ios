# SwiftLint — lancé par la CI en --strict : un avertissement fait échouer.
included:
  - CoproFirst
  - CoproFirstTests
  - CoproFirstUITests
  - Paquets/ClientAPI/Sources
  - Paquets/ClientAPI/Tests
  - Paquets/ClientAPI/Package.swift
excluded:
  - .build
  - Paquets/ClientAPI/.build
  # GÉNÉRÉS par scripts/generer-charte.py : une ligne par jeton, sans retour.
  - CoproFirst/Charte/Palette.swift
  - CoproFirst/Charte/Palette+Seine.swift
  - CoproFirst/Charte/Palette+Bordeaux.swift
  - CoproFirst/Charte/Palette+Bouteille.swift
  - CoproFirst/Charte/Palette+Cuivre.swift
  - CoproFirst/Charte/Palette+Prune.swift
  - CoproFirst/Charte/Palette+Roi.swift
  - CoproFirst/Charte/NaturesDuFil.swift
  - CoproFirst/Charte/StatutsAffaire.swift
  - CoproFirst/Charte/RolesUtilisateur.swift
  - CoproFirst/Navigation/PagesParDefaut.swift
# Les noms de tests sont des phrases en français (`lAccueilPorteLeNomDuProduit`).
disabled_rules:
  - identifier_name
opt_in_rules:
  - empty_count
  - force_unwrapping
  - implicitly_unwrapped_optional
  - sorted_imports
# La limite de 500 lignes par fichier est celle du socle (standards/02 §6),
# contrôlée aussi par scripts/verifier-depot.sh pour tous les fichiers.
file_length:
  warning: 500
  error: 500
line_length:
  warning: 120
  error: 160
  ignores_comments: true
# swift-format ajoute la virgule finale des listes sur plusieurs lignes : SwiftLint
# l'exige au lieu de la refuser, sinon les deux outils se contredisent.
trailing_comma:
  mandatory_comma: true
# swift-format met l'accolade d'une condition sur plusieurs lignes à la ligne : idem.
opening_brace:
  ignore_multiline_statement_conditions: true
