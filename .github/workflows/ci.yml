#
# CI : garde-fous du dépôt et REUSE (Linux) ; build, SwiftLint et tests unitaires ; tests
# d'interface en trois lots — en parallèle sur macOS, réunis sous le check requis. Une PR
# qui ne touche que la documentation n'occupe aucun exécutant macOS (#204).
# Actions épinglées par SHA de commit : une étiquette se déplace, un SHA non.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Une PR : sa nouvelle tête annule l'exécution périmée. `main` : jamais — chaque fusion se
# valide jusqu'au bout. Le filet de `main` après fusion (standards/09 §8 bis) n'existe que
# si sa CI aboutit : le 15/11/2026, 6 exécutions de main sur 8 avaient été annulées par
# la fusion suivante, aucune fusion n'était validée. Sur main, un groupe PAR COMMIT : GitHub
# ne garde qu'une exécution en attente par groupe, et deux fusions rapprochées évinçaient
# encore la précédente, sans annulation demandée (coprofirst-android#62). Les jobs
# d'interface ont, sur main, leur propre file (voir `interface`, #235).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  depot:
    name: Dépôt (500 lignes, encodage, modes, LICENSE, REUSE)
    # Rien n'y construit : Linux, pour laisser les exécutants macOS au build (#204).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Garde-fous du dépôt
        run: bash scripts/verifier-depot.sh
      - name: Écart au plancher (rien de généré n'est retouché à la main)
        # Régénère tout depuis le plancher de coprofirst (scripts/generateurs/_plancher.py)
        # et compare à l'octet, API simulée comprise ; une version publiée au-dessus,
        # c'est le workflow quotidien « Concordance avec CoproFirst » (#20).
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I scripts/concordance.py --plancher
      - name: Logo et sa licence identiques à coprofirst
        run: bash scripts/verifier-logo.sh
      - name: REUSE
        run: |
          python3 -m venv "$RUNNER_TEMP/reuse"
          "$RUNNER_TEMP/reuse/bin/pip" install --quiet --disable-pip-version-check "reuse[charset-normalizer]==6.2.0"
          "$RUNNER_TEMP/reuse/bin/reuse" lint

  # Documentation seule ? Lue sur la liste des fichiers de la PR ; un push sur main, une
  # liste vide ou illisible lancent tout (défaut fermé, scripts/ci_documentation_seule.py).
  detection:
    name: Documentation seule ?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      macos: ${{ steps.lue.outputs.macos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Fichiers changés
        id: lue
        env:
          EVENEMENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          TETE: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 -I scripts/ci_documentation_seule.py --autotest
          if [ "$EVENEMENT" = pull_request ]; then
            git diff --name-only "$BASE...$TETE" > "$RUNNER_TEMP/changes.txt"
          else
            : > "$RUNNER_TEMP/changes.txt"
          fi
          cat "$RUNNER_TEMP/changes.txt"
          python3 -I scripts/ci_documentation_seule.py < "$RUNNER_TEMP/changes.txt" | tee -a "$GITHUB_OUTPUT"

  # Les tests au simulateur en jobs parallèles, chacun sous son plafond (décision du
  # 12/11/2026, #139) : un job unique dépassait 85 min — 14 de build, plus de 70 de tests
  # d'interface sur un runner deux fois plus lent que le poste. On scinde, on ne relève
  # pas le plafond : le signal des unitaires arrive vite, et chaque job reste sous la
  # limite quand la suite grossit.
  unitaires:
    name: Unitaires (build, SwiftLint, client d'API)
    needs: detection
    if: needs.detection.outputs.macos == 'true'
    runs-on: macos-latest
    # 31 min sur le runner le plus lent vu (main, 16/11/2026), plus le passage en très grand
    # texte des parcours de la revue (#233, 416 s en taille normale sur ce runner) : 55.
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Xcode du runner
        run: xcodebuild -version
      - name: Outillage épinglé (outillage.env)
        run: bash scripts/installer-outillage-ci.sh
      - name: SwiftLint
        run: swiftlint lint --strict --quiet
      - name: Tests du client d'API (généré depuis openapi.json)
        working-directory: Paquets/ClientAPI
        run: swift test --disable-automatic-resolution
      - name: Projet Xcode (XcodeGen)
        run: bash scripts/generer-projet.sh
      - name: Build et tests unitaires au simulateur
        # La CI ne signe pas : aucun certificat ni secret Apple dans GitHub
        # (skill publication-app-store). project.yml signe, le poste seul.
        run: bash scripts/tests-simulateur.sh -only-testing:CoproFirstTests
      - name: Échantillon iPad (iPad Pro 13 pouces)
        # L'app est universelle (#219) : un ÉCHANTILLON sur iPad, dans ce job, sans runner
        # macOS de plus (#204) — la conformité du plist, l'entrée et la connexion. La suite
        # complète sur iPad se joue au poste avant la fusion d'un lot iPad (#220).
        # ParcoursUITests test par test : ses trois tests de la barre du bas n'ont pas cours
        # sur iPad (la TabView d'iPadOS n'y est pas une TabBar) ; la barre latérale (#221)
        # apporte leurs pendants iPad.
        env:
          APPAREIL: ipad
        run: >-
          bash scripts/tests-simulateur.sh
          -only-testing:CoproFirstTests/ConformiteAppStoreTests
          -only-testing:CoproFirstUITests/ParcoursUITests/testDeLAccueilAuFilParLaConnexion
          -only-testing:CoproFirstUITests/ParcoursUITests/testEnTresGrandTexteLeLogementPasseSousLeTitre
          -only-testing:CoproFirstUITests/ParcoursUITests/testLaDemoSOuvreDUnToucher
          -only-testing:CoproFirstUITests/ParcoursUITests/testLaPastilleMontreLesRolesEtSeDeconnecte
          -only-testing:CoproFirstUITests/VitrineUITests
          -only-testing:CoproFirstUITests/ConnexionUITests
      - name: Parcours de la revue d'Apple en très grand texte (AX5)
        # Le reste de la CI joue la taille par défaut : SuppressionCompteUITests (règle
        # 5.1.1 v) a cassé en très grand texte sans bruit après #196 (#232, #233). Un
        # passage FILTRÉ, dans ce job — ni runner macOS de plus (#204), ni minute de plus
        # aux lots d'interface (budget, #243). Une classe de la liste qui n'existe plus :
        # INCONNU ; un filtre qui ne joue rien : INCONNU (tests-simulateur.sh, #96, #170).
        # LancementCaptures.lancer() lit TEST_RUNNER_GRAND_TEXTE : une classe ajoutée ici
        # doit lancer l'app par lui.
        env:
          TEST_RUNNER_GRAND_TEXTE: 1
          REVUE_APPLE: SuppressionCompteUITests
        run: |
          filtres=()
          for classe in $REVUE_APPLE; do
            grep -qE "class $classe([^[:alnum:]_]|$)" CoproFirstUITests/*.swift \
              || { echo "::error::REVUE_APPLE nomme $classe, absente de CoproFirstUITests"; exit 2; }
            grep -q "LancementCaptures.lancer" "CoproFirstUITests/$classe.swift" \
              || { echo "::error::$classe ne lance pas l'app par LancementCaptures.lancer() : le très grand texte n'y serait pas posé"; exit 2; }
            filtres+=("-only-testing:CoproFirstUITests/$classe")
          done
          [ ${#filtres[@]} -gt 0 ] || { echo "::error::REVUE_APPLE est vide"; exit 2; }
          bash scripts/tests-simulateur.sh "${filtres[@]}"

  interface:
    name: Interface (${{ matrix.lot }}/3)
    needs: detection
    if: needs.detection.outputs.macos == 'true'
    runs-on: macos-latest
    # Sur main, une file PAR LOT et par branche, plus par commit (#235, standards/09 §8 bis) :
    # quatre fusions rapprochées faisaient 8 jobs d'environ 60 min pour 3 exécutants macOS.
    # L'exécution en cours va au bout (jamais annulée) ; GitHub ne garde que la DERNIÈRE en
    # attente, qui juge toute la plage. Un rouge désigne les commits depuis le dernier vert ;
    # un commit dont l'interface a été remplacée reste annulé (gris), jamais vert.
    # Sur une PR, rien de plus que le groupe du workflow.
    concurrency:
      group: >-
        ${{ github.event_name == 'push' && format('ci-interface-main-{0}', matrix.lot)
        || format('ci-interface-{0}-{1}', github.run_id, matrix.lot) }}
      cancel-in-progress: false
    # Les tests d'interface seuls font ~72 min (16/11/2026) : trois lots, chacun sous BUDGET_LOT.
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        lot: [1, 2, 3]
    env:
      # Les lots 1 et 2, nommés classe par classe ; le lot 3 joue TOUT le reste — une classe
      # neuve y tombe d'office, aucune n'est oubliée. Équilibrés sur les durées MESURÉES en CI
      # (moyennes de trois runs, 16/11/2026, #243) : ~72 min de tests, des runners qui varient
      # du simple à ~1,4 — à deux lots, un runner lent dépassait le budget (lot 1 : 68 min).
      # ~1560 s, ~1425 s et ~1320 s de tests, ~40 min par job, ~50 sur un runner lent.
      LOT_1: >-
        SaisieAffaireUITests PrestatairesAffaireUITests CartesDuFilUITests
        AffairesUITests HistoriqueUITests EcheanceUITests
      LOT_2: >-
        CommunauteUITests AdminUITests AccesUITests SondageUITests
        ApercusSaisieUITests DelegationsCSUITests
      # Minutes de l'étape de build et de tests : sous le plafond du job (70), pour qu'un lot
      # qui grossit échoue EN LE NOMMANT au lieu d'être coupé sans bilan (#243).
      BUDGET_LOT: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Xcode du runner
        run: xcodebuild -version
      - name: Outillage épinglé (outillage.env)
        run: bash scripts/installer-outillage-ci.sh
      - name: Projet Xcode (XcodeGen)
        run: bash scripts/generer-projet.sh
      - name: Build et tests d'interface au simulateur (lot ${{ matrix.lot }})
        # Requêtes d'accessibilité expirées, mesure à l'échec et relance bornée,
        # déclarée au résumé du run : scripts/tests-simulateur.sh (#50).
        env:
          LOT: ${{ matrix.lot }}
        run: |
          filtres=()
          [ "$LOT" = 3 ] && filtres+=(-only-testing:CoproFirstUITests)
          for nomme in 1 2; do
            liste=LOT_$nomme
            for classe in ${!liste}; do
              # Une classe renommée ne se jouerait plus nulle part, sans bruit : INCONNU.
              grep -qE "class $classe([^[:alnum:]_]|$)" CoproFirstUITests/*.swift \
                || { echo "::error::$liste nomme $classe, absente de CoproFirstUITests"; exit 2; }
              # Nommée deux fois, elle jouerait deux fois et fausserait l'équilibre.
              [ "$nomme" = 2 ] && grep -qw "$classe" <<< "$LOT_1" \
                && { echo "::error::$classe est dans LOT_1 et LOT_2"; exit 2; }
              if [ "$LOT" = "$nomme" ]; then
                filtres+=("-only-testing:CoproFirstUITests/$classe")
              elif [ "$LOT" = 3 ]; then
                filtres+=("-skip-testing:CoproFirstUITests/$classe")
              fi
            done
          done
          debut=$SECONDS
          # `bash -e` : le statut se garde pour que la durée s'écrive aussi sur un échec.
          statut=0
          bash scripts/tests-simulateur.sh "${filtres[@]}" || statut=$?
          minutes=$(( (SECONDS - debut + 59) / 60 ))
          echo "Lot $LOT : $minutes min de build et de tests (budget $BUDGET_LOT)" >> "$GITHUB_STEP_SUMMARY"
          [ "$statut" = 0 ] || exit "$statut"
          if [ "$minutes" -gt "$BUDGET_LOT" ]; then
            echo "::error::lot $LOT : $minutes min > $BUDGET_LOT — rééquilibrer LOT_1 et LOT_2 sur les durées mesurées (#243)"
            exit 1
          fi

  ios:
    # Le nom que la protection de main exige : il ne change pas. Vert seulement si les
    # unitaires ET les trois lots d'interface le sont, ou si la détection a LU une PR de
    # documentation seule — jamais par défaut : une détection en échec rend rouge. Sur les
    # PR seulement : sur main, une interface remplacée dans sa file (#235) le rendrait vert
    # sans avoir joué, ou rouge sans faute — chaque job y parle pour lui-même.
    name: Build, tests, SwiftLint
    needs: [detection, unitaires, interface]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Unitaires et interface verts, ou documentation seule
        env:
          DETECTION: ${{ needs.detection.result }}
          MACOS: ${{ needs.detection.outputs.macos }}
          UNITAIRES: ${{ needs.unitaires.result }}
          INTERFACE: ${{ needs.interface.result }}
        run: |
          echo "détection : $DETECTION (macos=$MACOS) ; unitaires : $UNITAIRES ; interface : $INTERFACE"
          if [ "$DETECTION" = success ] && [ "$MACOS" = false ]; then
            echo "Documentation seule : build et tests sautés, saut justifié par la liste lue."
            exit 0
          fi
          [ "$UNITAIRES" = success ] && [ "$INTERFACE" = success ]
