#
# CI : garde-fous du dépôt et REUSE (Linux) ; build, SwiftLint et tests unitaires ; l'Apple
# Watch ; échantillons ; tests d'interface en six lots — en parallèle sur macOS, réunis sous
# le check requis. Une PR qui ne touche que la documentation n'occupe aucun exécutant macOS
# (#204).
# Actions épinglées par SHA de commit : une étiquette se déplace, un SHA non.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Une PR : sa nouvelle tête annule l'exécution périmée. `main` : jamais — chaque fusion se
# valide jusqu'au bout. Le filet de `main` après fusion (standards/09 §8 bis) n'existe que
# si sa CI aboutit : le 15/11/2026, 6 exécutions de main sur 8 avaient été annulées par
# la fusion suivante, aucune fusion n'était validée. Sur main, un groupe PAR COMMIT : GitHub
# ne garde qu'une exécution en attente par groupe, et deux fusions rapprochées évinçaient
# encore la précédente, sans annulation demandée (coprofirst-android#62). Les jobs
# d'interface ont, sur main, leur propre file (voir `interface`, #235).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  depot:
    name: Dépôt (500 lignes, encodage, modes, LICENSE, REUSE)
    # Rien n'y construit : Linux, pour laisser les exécutants macOS au build (#204).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Garde-fous du dépôt
        # UNE étape, la même qu'au poste et au hook (#241) : écart au plancher, logo et
        # REUSE sont joués par ce script (scripts/controles-distants.sh). Un contrôle de
        # plus s'y ajoute, jamais ici — scripts/verifier-ci.py refuse une 2e étape.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/verifier-depot.sh

  # Documentation seule ? Lue sur la liste des fichiers de la PR ; un push sur main, une
  # liste vide ou illisible lancent tout (défaut fermé, scripts/ci_documentation_seule.py).
  detection:
    name: Documentation seule ?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      macos: ${{ steps.lue.outputs.macos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Fichiers changés
        id: lue
        env:
          EVENEMENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          TETE: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 -I scripts/ci_documentation_seule.py --autotest
          if [ "$EVENEMENT" = pull_request ]; then
            git diff --name-only "$BASE...$TETE" > "$RUNNER_TEMP/changes.txt"
          else
            : > "$RUNNER_TEMP/changes.txt"
          fi
          cat "$RUNNER_TEMP/changes.txt"
          python3 -I scripts/ci_documentation_seule.py < "$RUNNER_TEMP/changes.txt" | tee -a "$GITHUB_OUTPUT"

  # Les tests au simulateur en jobs parallèles, chacun sous son plafond (décision du
  # 12/11/2026, #139) : un job unique dépassait 85 min — 14 de build, plus de 70 de tests
  # d'interface sur un runner deux fois plus lent que le poste. On scinde, on ne relève
  # pas le plafond : le signal des unitaires arrive vite, et chaque job reste sous la
  # limite quand la suite grossit.
  unitaires:
    name: Unitaires (build, SwiftLint, client d'API)
    needs: detection
    if: needs.detection.outputs.macos == 'true'
    runs-on: macos-latest
    # Mesuré sur main le 18/11/2026 (#288) : 58 à 67 min avec l'échantillon iPad et l'Apple
    # TV, si près du plafond qu'une PR un peu lente le coupait sans défaut. Ces deux-là ont
    # leur propre build : ils sont passés au job « Échantillons ». Reste ici le très grand
    # texte, qui réutilise le build iPhone (4 min, contre ~17 ailleurs) : ~43 min attendues.
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Xcode du runner
        run: xcodebuild -version
      - name: Outillage épinglé (outillage.env)
        run: bash scripts/installer-outillage-ci.sh
      - name: SwiftLint
        run: swiftlint lint --strict --quiet
      - name: Tests du client d'API (généré depuis openapi.json)
        working-directory: Paquets/ClientAPI
        run: swift test --disable-automatic-resolution
      - name: Projet Xcode (XcodeGen)
        run: bash scripts/generer-projet.sh
      - name: Build et tests unitaires au simulateur
        # La CI ne signe pas : aucun certificat ni secret Apple dans GitHub
        # (skill publication-app-store). project.yml signe, le poste seul.
        run: bash scripts/tests-simulateur.sh -only-testing:CoproFirstTests
      - name: Parcours de la revue d'Apple en très grand texte (AX5)
        # Le reste de la CI joue la taille par défaut : SuppressionCompteUITests (règle
        # 5.1.1 v) a cassé en très grand texte sans bruit après #196 (#232, #233). Un
        # passage FILTRÉ, dans ce job — ni runner macOS de plus (#204), ni minute de plus
        # aux lots d'interface (budget, #243). Une classe de la liste qui n'existe plus :
        # INCONNU ; un filtre qui ne joue rien : INCONNU (tests-simulateur.sh, #96, #170).
        # LancementCaptures.lancer() lit TEST_RUNNER_GRAND_TEXTE : une classe ajoutée ici
        # doit lancer l'app par lui.
        env:
          TEST_RUNNER_GRAND_TEXTE: 1
          REVUE_APPLE: SuppressionCompteUITests
        run: |
          filtres=()
          for classe in $REVUE_APPLE; do
            grep -qE "class $classe([^[:alnum:]_]|$)" CoproFirstUITests/*.swift \
              || { echo "::error::REVUE_APPLE nomme $classe, absente de CoproFirstUITests"; exit 2; }
            grep -q "LancementCaptures.lancer" "CoproFirstUITests/$classe.swift" \
              || { echo "::error::$classe ne lance pas l'app par LancementCaptures.lancer() : le très grand texte n'y serait pas posé"; exit 2; }
            filtres+=("-only-testing:CoproFirstUITests/$classe")
          done
          [ ${#filtres[@]} -gt 0 ] || { echo "::error::REVUE_APPLE est vide"; exit 2; }
          bash scripts/tests-simulateur.sh "${filtres[@]}"

  montre:
    # Un job à part, en parallèle des autres (#226) : la montre a son propre build, comme les
    # échantillons ; ajoutée à Unitaires (l'iPhone et le très grand texte, ~43 min attendues),
    # elle l'aurait rapproché du plafond.
    # Mesuré sur #292 le 18/11/2026 (run 44308489685) : build et tests de la montre 18 min ;
    # build Release en -O pour deux architectures coupé au plafond de 45, après 27 min sans
    # finir. Le Release se construit désormais en arm64 seul et sans optimisation
    # (verifier-montre-dependante.sh) : ~20 min attendues au pire, soit ~40 min de job ;
    # 1,5 fois : 60. À reprendre sur la durée mesurée des premiers passages.
    name: Apple Watch (build, tests, app livrée dépendante)
    needs: detection
    if: needs.detection.outputs.macos == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Xcode du runner
        run: xcodebuild -version
      - name: Outillage épinglé (outillage.env)
        run: bash scripts/installer-outillage-ci.sh
      - name: Projet Xcode (XcodeGen)
        run: bash scripts/generer-projet.sh
      - name: Apple Watch — build et tests de la montre et du code partagé
        # La cible watchOS (#226) compile les mêmes fichiers que l'iPhone pour la charte, les
        # formats et l'alerte servie ; ses tests et ceux du code partagé y sont joués. Même
        # script, même verdict : INCONNU si aucune Apple Watch Series n'est disponible.
        env:
          APPAREIL: montre
          RESULTATS: .build/ResultatsMontre
        run: bash scripts/tests-simulateur.sh

      - name: Apple Watch — l'app livrée reste dépendante de l'iPhone
        # Construite en Release, l'app montre doit porter WKRunsIndependentlyOfCompanionApp à
        # false : l'étape qui la déclare indépendante ne vaut que pour le Debug du simulateur
        # (#226). Absente, true ou illisible : rouge, ou INCONNU si la construction échoue.
        run: bash scripts/verifier-montre-dependante.sh

  interface:
    name: Interface (${{ matrix.lot }}/${{ strategy.job-total }})
    needs: detection
    if: needs.detection.outputs.macos == 'true'
    runs-on: macos-latest
    # Sur main, une file PAR LOT et par branche, plus par commit (#235, standards/09 §8 bis) :
    # quatre fusions rapprochées faisaient 8 jobs d'environ 60 min pour 3 exécutants macOS.
    # L'exécution en cours va au bout (jamais annulée) ; GitHub ne garde que la DERNIÈRE en
    # attente, qui juge toute la plage. Un rouge désigne les commits depuis le dernier vert ;
    # un commit dont l'interface a été remplacée reste annulé (gris), jamais vert.
    # Sur une PR, rien de plus que le groupe du workflow.
    concurrency:
      group: >-
        ${{ github.event_name == 'push' && format('ci-interface-main-{0}', matrix.lot)
        || format('ci-interface-{0}-{1}', github.run_id, matrix.lot) }}
      cancel-in-progress: false
    # Les tests d'interface seuls font ~77 min en médiane (16/11/2026), ~137 le 20/11 : six lots, chacun sous BUDGET_LOT.
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        lot: [1, 2, 3, 4, 5, 6]
    env:
      # Les lots 1 à 4, nommés classe par classe ; le DERNIER lot joue TOUT le reste — une
      # classe neuve y tombe d'office, aucune n'est oubliée. Rééquilibrés le 17/11/2026 sur les
      # durées MESURÉES de 34 jobs d'interface depuis #260 (b57cd45), répartis sur le PIRE temps
      # de chaque classe : PrestatairesUITests y est passé de 11 à 14 min en médiane, 22 au plus
      # lent, et le lot 4 a dépassé le budget (63 min sur c3d25e2). 98 min de tests en médiane,
      # 135 au pire : ~18 à 22 min par lot en médiane, ~27 au pire, plus ~18 min de build au
      # plus lent : ~45 min d'étape, 10 de marge. Les classes de l'iPad seul (BarreLaterale,
      # ListeEtFiche, Carnet) restent au dernier lot : nommées, elles ne joueraient rien sur l'iPhone.
      # Le 19/11/2026 (#301), le dernier lot faisait 36 à 45 min d'étape et a dépassé le budget
      # sur #297 (56 min, tests verts) : PrestatairesUITests y pesait 13 à 23,7 min. Répartis
      # sur le PIRE temps de chaque classe, mesuré sur quatre runs (c4bdf79, b6f9b98, 23099de
      # et le lot 5 de #297) : 150 min de tests au pire, ~31 par lot nommé, ~26 pour le
      # dernier, qui garde de la place pour les classes neuves. Le build et la mise en route
      # prennent 15 à 17 min (25 une fois) : ~48 min d'étape au pire, 7 de marge.
      # Le 20/11/2026 (#286), ModerationUITests (neuve, 124 à 185 s) a porté le dernier lot à
      # 56 min (63dea6c, tests verts). Étape mesurée sur les dix derniers runs complets : lot 1
      # 21-54 min, lot 2 17-47 (médiane 37), lot 3 35-53, lot 4 24-51, lot 5 39-56. Elle va au
      # lot 2, le plus léger : ~40 min en médiane, ~50 au pire ; le dernier redescend à ~53 au pire.
      # Le soir même, le lot 1 a dépassé le budget sur main (ab11792 : 61 min, tests verts).
      # Mesuré sur les 50 jobs d'interface des dix derniers runs complets (44663465733 à
      # 44775072264) : 137 min de tests en médiane ; un runner lent étire TOUT son lot, jusqu'à
      # 1,33 fois la somme des médianes de ses classes (ab11792, lot 1) ; le build et la mise en
      # route prennent 6 à 21,5 min (17 en médiane). En cinq lots, ~27 min de médiane chacun :
      # 1,33 × 27 + 20 = 56 au pire, au budget même. En SIX, répartis sur les médianes : 22,5 à
      # 23,1 min chacun ; le pire observé d'un job (facteur et build du même job) donne 49 min
      # au plus, la somme des pires de chaque classe 28 à 32 min de tests (+ 17 de build : 45 à
      # 49). Le dernier lot, le plus léger, garde la place des classes neuves.
      # Un lot ajouté = une entrée de la matrice et un LOT_ de plus (#243).
      LOT_1: >-
        SuppressionCompteUITests AccesUITests DelegationsCSUITests ModerationUITests NatureUITests
        ConnexionUITests LiensUITests
      LOT_2: >-
        SaisieAffaireUITests EcransHallUITests GrandTexteUITests ConfirmationHoteUITests
        LogoResidenceUITests PiecesJointesUITests
      LOT_3: >-
        CartesDuFilUITests PrestatairesAffaireUITests AffairesUITests ParcoursUITests PushUITests
        VitrineUITests
      LOT_4: >-
        AdminUITests HistoriqueUITests AvisReglementUITests EspaceCSUITests EcheanceUITests
        RetourUITests ProtectionUITests
      LOT_5: >-
        PrestatairesUITests HorsLigneUITests ResidenceUITests
      # Minutes de l'étape de build et de tests : sous le plafond du job (70), pour qu'un lot
      # qui grossit échoue EN LE NOMMANT au lieu d'être coupé sans bilan (#243).
      BUDGET_LOT: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Xcode du runner
        run: xcodebuild -version
      - name: Outillage épinglé (outillage.env)
        run: bash scripts/installer-outillage-ci.sh
      - name: Projet Xcode (XcodeGen)
        run: bash scripts/generer-projet.sh
      - name: Build et tests d'interface au simulateur (lot ${{ matrix.lot }})
        # Requêtes d'accessibilité expirées, mesure à l'échec et relance bornée,
        # déclarée au résumé du run : scripts/tests-simulateur.sh (#50).
        env:
          LOT: ${{ matrix.lot }}
          DERNIER: ${{ strategy.job-total }}
        run: |
          filtres=()
          [ "$LOT" = "$DERNIER" ] && filtres+=(-only-testing:CoproFirstUITests)
          # Un LOT_ au rang du dernier ou au-delà ne se jouerait jamais comme tel : INCONNU.
          liste=LOT_$DERNIER
          [ -z "${!liste:-}" ] || { echo "::error::$liste nommé, mais le lot $DERNIER joue le reste"; exit 2; }
          vues=" "
          for nomme in $(seq 1 $((DERNIER - 1))); do
            liste=LOT_$nomme
            [ -n "${!liste:-}" ] || { echo "::error::$liste absent ou vide : la matrice compte $DERNIER lots"; exit 2; }
            for classe in ${!liste}; do
              # Une classe renommée ne se jouerait plus nulle part, sans bruit : INCONNU.
              grep -qE "class $classe([^[:alnum:]_]|$)" CoproFirstUITests/*.swift \
                || { echo "::error::$liste nomme $classe, absente de CoproFirstUITests"; exit 2; }
              # Nommée deux fois, elle jouerait deux fois et fausserait l'équilibre.
              case "$vues" in *" $classe "*) echo "::error::$classe nommée dans deux lots"; exit 2 ;; esac
              vues="$vues$classe "
              if [ "$LOT" = "$nomme" ]; then
                filtres+=("-only-testing:CoproFirstUITests/$classe")
              elif [ "$LOT" = "$DERNIER" ]; then
                filtres+=("-skip-testing:CoproFirstUITests/$classe")
              fi
            done
          done
          debut=$SECONDS
          # `bash -e` : le statut se garde pour que la durée s'écrive aussi sur un échec.
          statut=0
          bash scripts/tests-simulateur.sh "${filtres[@]}" || statut=$?
          minutes=$(( (SECONDS - debut + 59) / 60 ))
          echo "Lot $LOT : $minutes min de build et de tests (budget $BUDGET_LOT)" >> "$GITHUB_STEP_SUMMARY"
          [ "$statut" = 0 ] || exit "$statut"
          if [ "$minutes" -gt "$BUDGET_LOT" ]; then
            echo "::error::lot $LOT : $minutes min > $BUDGET_LOT — rééquilibrer les LOT_ sur les durées mesurées (#243)"
            exit 1
          fi

  echantillons:
    # Hors du job Unitaires depuis #288 : l'iPad et l'Apple TV construisent chacun pour leur
    # destination, sans rien réutiliser du build iPhone — les y laisser poussait Unitaires à
    # 67 min sur 70. Un exécutant macOS de plus par run (#204), décidé le 18/11/2026 : un
    # dépassement coûte une relance de 70 min. Seul, sans build iPhone à réutiliser : 27 min
    # sur #289 (iPad 22,6 + Apple TV 4,1), puis coupé à 40 sur un runner ~1,35 fois plus lent
    # (iPad 32,2 min, dont 13,8 de tests ; Apple TV encore au build à 7,7). Au pire mesuré,
    # ~42 min ; plafond à 1,5 fois : 65.
    name: Échantillons (iPad, Apple TV)
    needs: detection
    if: needs.detection.outputs.macos == 'true'
    runs-on: macos-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Xcode du runner
        run: xcodebuild -version
      - name: Outillage épinglé (outillage.env)
        run: bash scripts/installer-outillage-ci.sh
      - name: Projet Xcode (XcodeGen)
        run: bash scripts/generer-projet.sh
      - name: Échantillon iPad (iPad Pro 13 pouces)
        # L'app est universelle (#219) : un ÉCHANTILLON sur iPad — la conformité du plist,
        # l'entrée et la connexion. La suite complète sur iPad se joue au poste avant la
        # fusion d'un lot iPad (#220).
        # ParcoursUITests test par test : ses trois tests de la barre du bas n'ont pas cours
        # sur iPad, où la barre latérale les remplace (BarreLateraleUITests, #221).
        env:
          APPAREIL: ipad
        run: >-
          bash scripts/tests-simulateur.sh
          -only-testing:CoproFirstTests/ConformiteAppStoreTests
          -only-testing:CoproFirstUITests/ParcoursUITests/testDeLAccueilAuFilParLaConnexion
          -only-testing:CoproFirstUITests/ParcoursUITests/testEnTresGrandTexteLeLogementPasseSousLeTitre
          -only-testing:CoproFirstUITests/ParcoursUITests/testLaDemoSOuvreDUnToucher
          -only-testing:CoproFirstUITests/ParcoursUITests/testLaPastilleMontreLesRolesEtSeDeconnecte
          -only-testing:CoproFirstUITests/VitrineUITests
          -only-testing:CoproFirstUITests/ConnexionUITests
          -only-testing:CoproFirstUITests/BarreLateraleUITests
          -only-testing:CoproFirstTests/PresentationNavigationTests
          -only-testing:CoproFirstUITests/ListeEtFicheUITests
          -only-testing:CoproFirstTests/ListeEtFicheTests
          -only-testing:CoproFirstUITests/AffairesUITests/testCommandeNOuvreUneNouvelleAffaire
          -only-testing:CoproFirstUITests/PrestatairesAffaireUITests
          -only-testing:CoproFirstUITests/CartesDuFilUITests/testLeConseilModifieLAffaireDepuisLeBandeau
          -only-testing:CoproFirstUITests/SondageUITests
      - name: Écran de hall (Apple TV) — build et tests du code partagé
        # La cible tvOS (#218) compile les mêmes fichiers que l'iPhone pour la charte et
        # les formats ; leurs tests y sont rejoués. Même script, même verdict : INCONNU
        # si aucune Apple TV de série n'est disponible sur le runner.
        env:
          APPAREIL: tv
          RESULTATS: .build/ResultatsTV
        run: bash scripts/tests-simulateur.sh

  ios:
    # Le nom que la protection de main exige : il ne change pas. Vert seulement si CHAQUE job
    # de `needs` hors la détection l'est, ou si la détection a LU une PR de documentation
    # seule — jamais par défaut : une détection en échec rend rouge. Un job ajouté à `needs`
    # est exigé d'office, sans ligne de plus ici (#288) ; scripts/verifier-ci.py refuse un
    # job macOS absent de `needs`. Sur les PR seulement : sur main, une interface remplacée
    # dans sa file (#235) le rendrait vert sans avoir joué, ou rouge sans faute — chaque job
    # y parle pour lui-même.
    name: Build, tests, SwiftLint
    needs: [detection, unitaires, montre, echantillons, interface]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Chaque job macOS vert, ou documentation seule
        env:
          DETECTION: ${{ needs.detection.result }}
          MACOS: ${{ needs.detection.outputs.macos }}
          BESOINS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key) : \(.value.result)"' <<<"$BESOINS"
          if [ "$DETECTION" = success ] && [ "$MACOS" = false ]; then
            echo "Documentation seule : build et tests sautés, saut justifié par la liste lue."
            exit 0
          fi
          # Illisible ou sans autre job que la détection : rouge, jamais vert par défaut.
          [ "$(jq 'del(.detection) | length' <<<"$BESOINS")" -ge 1 ] \
            || { echo "::error::aucun job à juger dans needs"; exit 1; }
          rouges=$(jq -r 'del(.detection) | to_entries[] | select(.value.result != "success") | .key' <<<"$BESOINS")
          [ -z "$rouges" ] || { echo "::error::pas verts : $(echo $rouges)"; exit 1; }
