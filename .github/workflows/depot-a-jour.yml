#
# Le job « Dépôt » rejoué sur l'arbre FUSIONNÉ, à chaque poussée de main (#353). `strict`
# reste désactivé (décision du 15/11/2026, standards/09 §8 bis) : une PR fusionne sur un
# « Dépôt » joué avant que main bouge — le 19/11, #303 a ainsi porté verifier-depot.sh à 502
# lignes, main rouge neuf heures. Ici, sans macOS (une minute par arbre) :
#   1. juger (lecture seule) : main, puis chaque PR armée (fusion automatique, base main,
#      même dépôt) réunie à main — `bash scripts/verifier-depot.sh`, le même qu'au poste ;
#   2. agir (scripts/depot_a_jour.py, décision pure et testée) : main verte, la PR qui rougirait
#      voit sa fusion automatique DÉSARMÉE, avec un commentaire. Main rouge ne désarme rien (la
#      réparation doit passer) : son ticket s'ouvre par l'alerte de chaque job (#362). Un
#      INCONNU ou un conflit ne désarme rien.
# Le code d'une PR ne tourne que dans le job 1, au jeton en lecture seule ; le job 2 n'exécute
# que les scripts de main. Complète la santé quotidienne (sante-main.yml).
# Actions épinglées par SHA de commit : une étiquette se déplace, un SHA non.
name: Dépôt à jour

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: depot-a-jour
  cancel-in-progress: true

jobs:
  juger:
    name: Dépôt de main et des PR armées, réunies à main
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    outputs:
      verdicts: ${{ steps.verdicts.outputs.verdicts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Juger
        id: verdicts
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          juger() { (cd "$1" && bash scripts/verifier-depot.sh > "$2" 2>&1); echo $?; }
          MAIN=$(juger . "$RUNNER_TEMP/main.txt")
          echo "::group::main → $MAIN"; tail -20 "$RUNNER_TEMP/main.txt"; echo "::endgroup::"
          NUMEROS=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --base main --limit 50 \
            --json number,isCrossRepository,autoMergeRequest \
            -q '.[] | select(.isCrossRepository | not) | select(.autoMergeRequest != null) | .number') \
            || { echo "❓ INCONNU : liste des PR illisible"; NUMEROS=""; }
          PRS=""
          for n in $NUMEROS; do
            d="$RUNNER_TEMP/pr-$n"
            git fetch -q origin "pull/$n/head:pr-$n" && git worktree add -q --detach "$d" HEAD
            if git -C "$d" -c user.name=ci -c user.email=ci@example.invalid merge -q --no-edit "pr-$n"; then
              code=$(juger "$d" "$RUNNER_TEMP/pr-$n.txt")
              echo "::group::#$n réunie à main → $code"; tail -20 "$RUNNER_TEMP/pr-$n.txt"; echo "::endgroup::"
            else
              code=conflit; echo "#$n : conflit avec main, la fusion est déjà bloquée"
            fi
            PRS="$PRS{\"numero\": $n, \"code\": \"$code\"},"
          done
          echo "verdicts={\"main\": \"$MAIN\", \"prs\": [${PRS%,}]}" | tee -a "$GITHUB_OUTPUT"

  agir:
    name: Désarmer la PR qui rougirait
    needs: juger
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Autotest (main verte et une PR rouge une fois réunie, désarmer ; sinon rien)
        run: python3 -I scripts/depot_a_jour.py --autotest
      - name: Décision et gestes (scripts/depot_a_jour.py)
        env:
          VERDICTS: ${{ needs.juger.outputs.verdicts }}
        run: |
          RUN="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          echo "${VERDICTS:-{\}}"
          for n in $(printf '%s' "${VERDICTS:-{\}}" | python3 -I scripts/depot_a_jour.py decider | sed -n 's/^desarmer //p'); do
            gh pr merge "$n" --repo "$GITHUB_REPOSITORY" --disable-auto
            gh pr comment "$n" --repo "$GITHUB_REPOSITORY" --body "⛔ Réunie à \`main\` ($GITHUB_SHA), cette PR rend le job « Dépôt » rouge ($RUN) : fusion automatique désarmée. Réunir \`main\`, corriger, puis réarmer (#353)."
          done
      - name: Alerte d'un rouge de main ou d'un passage planifié (scripts/signaler_rouge.py, #362)
        if: failure() || needs.juger.result != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/signaler_rouge.py --signaler
