#
# Concordance avec CoproFirst (#20 ; standards/09 §8, règle 2), chaque jour, deux
# verdicts distincts (scripts/concordance.py) :
#   1. ÉCART AU PLANCHER — ce qui est généré n'est plus ce que le plancher
#      (scripts/generateurs/_plancher.py) régénère, ou l'API simulée sert un champ
#      que le serveur ne sert pas : ROUGE, ticket « concordance » ouvert ou complété ;
#   2. MONTÉE POSSIBLE — une version publiée au-dessus du plancher : information,
#      jamais rouge, ticket « a-monter » ouvert une fois et tenu à jour (ce que la
#      montée exigerait : champs devenus requis, fichiers qui changeraient).
# Une version illisible : INCONNU, rouge, jamais vert. La décision des tickets est
# pure et testée (scripts/tickets_concordance.py, #67) : un vert ferme le ticket
# « concordance » en citant le run ; un rouge ou un INCONNU ne ferme jamais rien ;
# « a-monter » se ferme à la main, quand le plancher monte.
# Actions épinglées par SHA de commit : une étiquette se déplace, un SHA non.
name: Concordance avec CoproFirst

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      simuler_ecart:
        description: "Poser un écart exprès (le contrôle doit passer au rouge ; sans ticket, sauf ouvrir_ticket)"
        type: boolean
        default: false
      ouvrir_ticket:
        description: "Avec simuler_ecart : ouvrir vraiment le ticket — essai de l'ouverture, que le prochain vert ferme (#67)"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: concordance
  cancel-in-progress: false

jobs:
  concordance:
    name: Écart au plancher, montée possible
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Autotests (un écart posé exprès est vu, un cas zéro passe)
        run: |
          python3 -I scripts/concordance.py --autotest
          python3 -I scripts/verifier-fixtures.py --autotest
          python3 -I scripts/tickets_concordance.py --autotest
      - name: Écart au plancher
        id: plancher
        env:
          SIMULER: ${{ inputs.simuler_ecart && '--simuler-ecart' || '' }}
        run: |
          set +e
          # shellcheck disable=SC2086 # SIMULER est vide ou une seule option.
          python3 -I scripts/concordance.py --plancher --rapport "$RUNNER_TEMP/plancher.md" $SIMULER
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Montée possible
        id: montee
        run: |
          set +e
          python3 -I scripts/concordance.py --montee --rapport "$RUNNER_TEMP/montee.md"
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Décision (scripts/tickets_concordance.py)
        id: decision
        env:
          PLANCHER: ${{ steps.plancher.outputs.code }}
          MONTEE: ${{ steps.montee.outputs.code }}
        run: |
          ouvert() {
            gh issue list --repo "$GITHUB_REPOSITORY" --label "$1" --state open --json number --jq '.[0].number // empty'
          }
          ROUGE=$(ouvert concordance)
          A_MONTER=$(ouvert a-monter)
          { python3 -I scripts/tickets_concordance.py decider "$PLANCHER" "$MONTEE" "$ROUGE" "$A_MONTER"
            echo "ticket=$ROUGE"
            echo "ticket_a_monter=$A_MONTER"; } | tee -a "$GITHUB_OUTPUT"
      - name: Tickets
        if: ${{ !inputs.simuler_ecart || inputs.ouvrir_ticket }}
        env:
          PLANCHER: ${{ steps.plancher.outputs.code }}
          MONTEE: ${{ steps.montee.outputs.code }}
          CONCORDANCE: ${{ steps.decision.outputs.concordance }}
          A_MONTER: ${{ steps.decision.outputs.a_monter }}
          TICKET: ${{ steps.decision.outputs.ticket }}
          TICKET_A_MONTER: ${{ steps.decision.outputs.ticket_a_monter }}
          ESSAI: ${{ inputs.simuler_ecart && inputs.ouvrir_ticket }}
        run: |
          RUN="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          etiquette() {
            gh label create "$1" --repo "$GITHUB_REPOSITORY" --color "$2" --description "$3" --force
          }
          corps() {
            [ "$ESSAI" != "true" ] || printf '🧪 Essai : écart posé exprès (simuler_ecart, ouvrir_ticket). Le prochain vert doit fermer ce ticket (#67).\n\n'
            cat "$RUNNER_TEMP/plancher.md" 2>/dev/null || echo "❓ INCONNU — aucun rapport du plancher (code « $PLANCHER »)."
            [ "$MONTEE" != "2" ] || cat "$RUNNER_TEMP/montee.md"
            [ "$MONTEE" = "0" ] || [ "$MONTEE" = "2" ] || [ "$MONTEE" = "3" ] || echo "❓ INCONNU — montée : code « $MONTEE »."
            printf '\nExécution : %s\n' "$RUN"
          }
          # 1. Écart au plancher ou INCONNU : un ticket ouvert ou complété ; vert : fermé.
          case "$CONCORDANCE" in
            ouvrir)
              etiquette concordance D93F0B "Écart entre l'app et son plancher de coprofirst, ou version illisible (#20)"
              corps > "$RUNNER_TEMP/rouge.md"
              gh issue create --repo "$GITHUB_REPOSITORY" --label concordance --body-file "$RUNNER_TEMP/rouge.md" \
                --title "Concordance avec CoproFirst : écart au plancher ou version illisible" ;;
            completer)
              corps > "$RUNNER_TEMP/rouge.md"
              gh issue comment "$TICKET" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/rouge.md" ;;
            fermer)
              gh issue close "$TICKET" --repo "$GITHUB_REPOSITORY" --reason completed \
                --comment "✅ Revenu au vert : aucun écart au plancher ($RUN). Fermé par la concordance (#67)." ;;
            rien) ;;
            *) echo "❓ décision illisible : « $CONCORDANCE »"; exit 1 ;;
          esac
          # 2. Montée possible : une information, un seul ticket, tenu à jour.
          if [ "$A_MONTER" != "rien" ]; then
            printf '\nMis à jour par %s\n' "$RUN" >> "$RUNNER_TEMP/montee.md"
          fi
          case "$A_MONTER" in
            mettre-a-jour)
              gh issue edit "$TICKET_A_MONTER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/montee.md" ;;
            ouvrir)
              etiquette a-monter 0E8A16 "Une version de coprofirst publiée au-dessus du plancher de l'app (#20)"
              gh issue create --repo "$GITHUB_REPOSITORY" --label a-monter --body-file "$RUNNER_TEMP/montee.md" \
                --title "CoproFirst : une version publiée au-dessus du plancher de l'app" ;;
            rien) ;;
            *) echo "❓ décision illisible : « $A_MONTER »"; exit 1 ;;
          esac
      - name: Verdict
        env:
          MONTEE: ${{ steps.montee.outputs.code }}
          VERDICT: ${{ steps.decision.outputs.verdict }}
        run: |
          [ "$MONTEE" != "3" ] || echo "ℹ️ montée possible — ticket « a-monter » (information, pas un rouge)"
          case "$VERDICT" in
            vert) echo "✅ aucun écart au plancher" ;;
            rouge) echo "❌ écart au plancher — ticket « concordance »"; exit 1 ;;
            *) echo "❓ INCONNU — rien n'a pu être comparé : ce n'est pas un vert"; exit 1 ;;
          esac
