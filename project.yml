#
# Le projet Xcode se GÉNÈRE depuis ce fichier (XcodeGen) : CoproFirst.xcodeproj
# n'est pas versionné. `bash scripts/generer-projet.sh` après chaque modification.
name: CoproFirst
options:
  bundleIdPrefix: fr.coprofirst
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: fr
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1"
    # Équipe Apple Developer (compte de particulier, ouvert le 01/11/2026) :
    # signature automatique. L'identifiant d'équipe n'est pas secret — il figure
    # dans chaque app signée. Les certificats et la connexion de Xcode au compte
    # restent sur le poste (skill publication-app-store) ; la CI ne signe pas
    # (CODE_SIGNING_ALLOWED=NO dans .github/workflows/ci.yml).
    DEVELOPMENT_TEAM: GUX8KASNTG
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: "YES"
    SWIFT_EMIT_LOC_STRINGS: "YES"
packages:
  ClientAPI:
    path: Paquets/ClientAPI
targets:
  CoproFirst:
    type: application
    platform: iOS
    sources:
      # Tout le dossier, par motif : un dossier neuf (`Fonctions/<Menu>/`, #10) est
      # compilé sans toucher ce fichier — les sessions parallèles ne s'y croisent pas.
      # Le manifeste de confidentialité (CoproFirst/PrivacyInfo.xcprivacy, #19) est embarqué
      # par cette ligne, comme ressource à la racine de l'app : `ManifesteConfidentialiteTests`
      # le relit dans l'app construite, scripts/verifier-confidentialite.py le tient au code.
      - path: CoproFirst
    dependencies:
      - package: ClientAPI
    info:
      path: CoproFirst/Info.plist
      properties:
        CFBundleDisplayName: CoproFirst
        CFBundleDevelopmentRegion: fr
        # Français seul : aucune autre langue n'est proposée (CLAUDE.md).
        CFBundleLocalizations: [fr]
        ITSAppUsesNonExemptEncryption: false
        # Le QR code de la fiche d'arrivée porte l'adresse du site de la résidence.
        NSCameraUsageDescription: "La caméra lit le QR code de votre fiche d'arrivée, qui donne l'adresse de votre résidence."
        # Le jeton de session gardé au Trousseau ne se lit qu'après Face ID.
        NSFaceIDUsageDescription: "Face ID ouvre votre espace sans ressaisir votre mot de passe."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    # Droits de l'app, générés comme l'Info.plist (non versionnés). Capacités
    # enregistrées au compte Apple par la signature automatique, au poste (10/11/2026,
    # accord de Philippe) : Push (#17, relais coprofirst#2494) et liens universels (#18,
    # AASA servi par coprofirst#2459). La CI ne signe pas : ces droits n'y servent pas.
    entitlements:
      path: CoproFirst/CoproFirst.entitlements
      properties:
        # « development » au poste ; l'archive de distribution le passe à « production ».
        aps-environment: development
        # Le niveau « time-sensitive » des seuls avis URGENTS (fuite, ascenseur bloqué),
        # décidé le 03/11/2026 (spec push de coprofirst, §10 décision 2) : le relais le pose
        # dans la charge, ce droit le laisse traverser le mode Concentration. Sans lui, iOS
        # le rend au niveau normal. Capacité « Time Sensitive Notifications » acceptée par
        # Philippe le 11/11/2026 (#17) : la signature automatique l'enregistre au compte Apple
        # à la prochaine compilation signée au poste.
        com.apple.developer.usernotifications.time-sensitive: true
        # Les installations connues qui servent l'AASA de l'app. Liste à arrêter au
        # lot #18 : une installation hors de cette liste n'ouvre pas l'app par un lien.
        com.apple.developer.associated-domains:
          - applinks:demo.coprofirst.fr
          - applinks:5hostachy.fr
    settings:
      base:
        # FIGÉ le 01/11/2026 : c'est un contrat — liens universels
        # (GUX8KASNTG.fr.coprofirst.app, coprofirst#2459), APNs, App Store Connect.
        # En changer après la création de l'app dans App Store Connect est impossible.
        PRODUCT_BUNDLE_IDENTIFIER: fr.coprofirst.app
        PRODUCT_NAME: CoproFirst
        GENERATE_INFOPLIST_FILE: "NO"
  CoproFirstTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CoproFirstTests
    dependencies:
      - target: CoproFirst
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.coprofirst.app.tests
        GENERATE_INFOPLIST_FILE: "YES"
  CoproFirstUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CoproFirstUITests
    dependencies:
      - target: CoproFirst
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.coprofirst.app.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: CoproFirst
schemes:
  CoproFirst:
    build:
      targets:
        CoproFirst: all
    run:
      config: Debug
    test:
      config: Debug
      language: fr
      region: FR
      targets:
        - CoproFirstTests
        - CoproFirstUITests
