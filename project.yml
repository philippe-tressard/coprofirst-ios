#
# Le projet Xcode se GÉNÈRE depuis ce fichier (XcodeGen) : CoproFirst.xcodeproj
# n'est pas versionné. `bash scripts/generer-projet.sh` après chaque modification.
name: CoproFirst
# L'app montre embarquée dans l'iPhone, à l'archive seulement (project-archive.yml, #226).
include:
  - path: project-archive.yml
    enable: ${ARCHIVE_AVEC_MONTRE}
options:
  bundleIdPrefix: fr.coprofirst
  deploymentTarget:
    iOS: "17.0"
    # L'écran de hall sur Apple TV (#218) : la même version minimale que l'iPhone.
    tvOS: "17.0"
    # L'Apple Watch (#226) : watchOS 10, le premier à poser la pile de widgets et
    # NavigationStack au poignet.
    watchOS: "10.0"
  developmentLanguage: fr
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1,2"
    # Équipe Apple Developer (compte de particulier, ouvert le 01/11/2026) :
    # signature automatique. L'identifiant d'équipe n'est pas secret — il figure
    # dans chaque app signée. Les certificats et la connexion de Xcode au compte
    # restent sur le poste (skill publication-app-store) ; la CI ne signe pas
    # (CODE_SIGNING_ALLOWED=NO, passé par les scripts que la CI lance : tests-simulateur.sh,
    # verifier-archive-montre.sh, verifier-montre-dependante.sh).
    DEVELOPMENT_TEAM: GUX8KASNTG
    CODE_SIGN_STYLE: Automatic
    # La version publiée suivante ; chaque version soumise porte son étiquette vX.Y.Z.
    MARKETING_VERSION: "1.2"
    CURRENT_PROJECT_VERSION: "3"
    LOCALIZATION_PREFERS_STRING_CATALOGS: "YES"
    SWIFT_EMIT_LOC_STRINGS: "YES"
settingGroups:
  # La montre importe `ClientAPI` et reçoit le module `ClientAPIMontre` : le même code sous
  # un autre nom de cible, pour que l'iPhone l'embarque sans collision du greffon (#324).
  clientMontre:
    OTHER_SWIFT_FLAGS: $(inherited) -module-alias ClientAPI=ClientAPIMontre
packages:
  ClientAPI:
    path: Paquets/ClientAPI
targets:
  CoproFirst:
    type: application
    platform: iOS
    sources:
      # Tout le dossier, par motif : un dossier neuf (`Fonctions/<Menu>/`, #10) est
      # compilé sans toucher ce fichier — les sessions parallèles ne s'y croisent pas.
      # Le manifeste de confidentialité (CoproFirst/PrivacyInfo.xcprivacy, #19) est embarqué
      # par cette ligne, comme ressource à la racine de l'app : `ManifesteConfidentialiteTests`
      # le relit dans l'app construite, scripts/verifier-confidentialite.py le tient au code.
      - path: CoproFirst
      # Le texte d'Apache-2.0 des paquets embarqués (#168) : le fichier de LICENSES/ lui-même,
      # copié dans l'app — une seule copie du texte, que « À propos › Composants tiers » lit.
      - path: LICENSES/Apache-2.0.txt
        buildPhase: resources
    dependencies:
      - package: ClientAPI
    info:
      path: CoproFirst/Info.plist
      properties:
        CFBundleDisplayName: CoproFirst
        CFBundleDevelopmentRegion: fr
        # Une seule source de la version : les réglages du projet (MARKETING_VERSION,
        # CURRENT_PROJECT_VERSION). XcodeGen écrirait sinon « 1.0 » et « 1 » en dur, et
        # l'archive dirait autre chose que le projet.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Français seul : aucune autre langue n'est proposée (CLAUDE.md).
        CFBundleLocalizations: [fr]
        ITSAppUsesNonExemptEncryption: false
        # Le QR code de la fiche d'arrivée porte l'adresse du site de la résidence.
        NSCameraUsageDescription: "La caméra lit le QR code de votre fiche d'arrivée, qui donne l'adresse de votre résidence."
        # Le jeton de session gardé au Trousseau ne se lit qu'après Face ID.
        NSFaceIDUsageDescription: "Face ID ouvre votre espace sans ressaisir votre mot de passe."
        UILaunchScreen: {}
        # « Continuer sur l'iPhone » depuis l'Apple Watch (Handoff, #226) : la cloche de la
        # résidence reliée (`ClocheSurLiPhone.type`).
        NSUserActivityTypes: [fr.coprofirst.app.cloche]
        # iPhone : portrait seul. iPad : les quatre orientations — la condition des fenêtres
        # redimensionnables d'iPadOS (multitâche, Split View) ; pas de UIRequiresFullScreen (#220).
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    # Droits de l'app, générés comme l'Info.plist (non versionnés). Capacités
    # enregistrées au compte Apple par la signature automatique, au poste (10/11/2026,
    # accord de Philippe) : Push (#17, relais coprofirst#2494) et liens universels (#18,
    # AASA servi par coprofirst#2459). La CI ne signe pas : ces droits n'y servent pas.
    entitlements:
      path: CoproFirst/CoproFirst.entitlements
      properties:
        # « development » au poste ; l'archive de distribution le passe à « production ».
        aps-environment: development
        # Le niveau « time-sensitive » des seuls avis URGENTS (fuite, ascenseur bloqué),
        # décidé le 03/11/2026 (spec push de coprofirst, §10 décision 2) : le relais le pose
        # dans la charge, ce droit le laisse traverser le mode Concentration. Sans lui, iOS
        # le rend au niveau normal. Capacité « Time Sensitive Notifications » acceptée par
        # Philippe le 11/11/2026 (#17) : la signature automatique l'enregistre au compte Apple
        # à la prochaine compilation signée au poste.
        com.apple.developer.usernotifications.time-sensitive: true
        # Les installations connues qui servent l'AASA de l'app. Liste non arrêtée (#18
        # clos pour abandon le 17/11/2026) : une installation hors de cette liste n'ouvre
        # pas l'app par un lien.
        com.apple.developer.associated-domains:
          - applinks:demo.coprofirst.fr
          - applinks:5hostachy.fr
    settings:
      base:
        # FIGÉ le 01/11/2026 : c'est un contrat — liens universels
        # (GUX8KASNTG.fr.coprofirst.app, coprofirst#2459), APNs, App Store Connect.
        # En changer après la création de l'app dans App Store Connect est impossible.
        PRODUCT_BUNDLE_IDENTIFIER: fr.coprofirst.app
        PRODUCT_NAME: CoproFirst
        # iPhone et iPad (#219, décision du 15/11/2026 : app iPad native). Écrit sur la cible aussi :
        # XcodeGen y pose sa propre valeur, que le réglage du projet ne corrige pas.
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: "NO"
  CoproFirstTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CoproFirstTests
    dependencies:
      - target: CoproFirst
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.coprofirst.app.tests
        GENERATE_INFOPLIST_FILE: "YES"
  CoproFirstUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CoproFirstUITests
    dependencies:
      - target: CoproFirst
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.coprofirst.app.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        # Le principal du paquet imprime l'empreinte compilée des sources : le binaire JOUÉ se
        # prouve (scripts/empreinte_tests.py, #328).
        INFOPLIST_KEY_NSPrincipalClass: EmpreinteDesTests
        TEST_TARGET_NAME: CoproFirst
  # L'écran de hall sur Apple TV (#218) : il fait défiler, en lecture seule, les affiches
  # d'un périmètre — ce n'est pas l'app du résident. Il compile les MÊMES fichiers que
  # l'iPhone pour la charte et les formats du site, nommément : un dossier de l'app n'y
  # entre que s'il compile pour tvOS sans `#if os(…)`. Ce qui est propre à iOS s'isole dans
  # son fichier et s'exclut ici, avec sa raison.
  CoproFirstTV:
    type: application
    platform: tvOS
    sources:
      - path: CoproFirstTV
      - path: CoproFirst/Charte
        excludes:
          # tvOS n'a pas de grands titres de barre.
          - ApparenceNavigation.swift
          # Les onglets des pages du site : la navigation de l'iPhone, rien à l'écran de hall.
          - OngletsDuSite.swift
      - path: CoproFirst/Commun/Texte
      # L'entrée dans une installation (lot 2) : l'adresse, GET /config, le plancher et les
      # phrases d'échec — les fichiers de l'iPhone, nommément.
      - path: CoproFirst/Session/Installation.swift
      - path: CoproFirst/Session/Decouverte.swift
      - path: CoproFirst/Session/VersionContrat.swift
      - path: CoproFirst/Session/ContratDuPlancher.swift
      - path: CoproFirst/Session/ErreurService.swift
      - path: CoproFirst/Commun/Session/RefusDuServeur.swift
      - path: CoproFirst/Entree/Decouverte/EtatDecouverte.swift
      # L'appairage gardé (lot 3) : le coffre sans biométrie de l'iPhone, au Trousseau.
      - path: CoproFirst/Session/CoffreDuCompte.swift
      - path: CoproFirst/Entree/Contenu/ContenuVitrine.swift
      # Ce qu'une `Installation` porte de GET /config : l'ordre des pages, le profil.
      - path: CoproFirst/Navigation/PageDeNavigation.swift
      - path: CoproFirst/Navigation/PagesParDefaut.swift
      - path: CoproFirst/Donnees/ProfilResidence.swift
      # « À propos » de l'écran de hall (#320) : le code de l'app et sa licence (condition 3 b
      # de la permission App Store), et les paquets embarqués avec leurs textes entiers — la
      # liste, les mots et les FICHIERS de l'iPhone, jamais une copie.
      # scripts/verifier-dependances.py refuse une cible qui embarque un paquet sans eux.
      - path: CoproFirst/Fonctions/APropos/ComposantsTiers.swift
      - path: CoproFirst/Fonctions/APropos/SourceDeLApp.swift
      - path: CoproFirst/Fonctions/APropos/Genere/TextesDuPied.swift
      - path: CoproFirst/Ressources/AvisTiers
        buildPhase: resources
      - path: LICENSES/Apache-2.0.txt
        buildPhase: resources
    dependencies:
      - package: ClientAPI
    info:
      path: CoproFirstTV/Info.plist
      properties:
        CFBundleDisplayName: CoproFirst
        CFBundleDevelopmentRegion: fr
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [fr]
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
    settings:
      base:
        # Le MÊME identifiant que l'iPhone (FIGÉ, voir CoproFirst) : une seule fiche App Store,
        # un achat universel ; la plateforme tvOS s'y ajoute (geste de Philippe, lot 6).
        PRODUCT_BUNDLE_IDENTIFIER: fr.coprofirst.app
        PRODUCT_NAME: CoproFirst
        # Apple TV seule.
        TARGETED_DEVICE_FAMILY: "3"
        GENERATE_INFOPLIST_FILE: "NO"
        # L'icône en couches et l'image de l'étagère (#320), rendues depuis le logo par
        # scripts/importer-logo.sh : `CoproFirstTV/Ressources/Assets.xcassets`.
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
  # Les tests du code PARTAGÉ, rejoués sur tvOS : les mêmes fichiers que CoproFirstTests,
  # nommément — jamais une copie (#218).
  CoproFirstTVTests:
    type: bundle.unit-test
    platform: tvOS
    sources:
      # Ceux qui ne lisent que la charte et le texte du site. FormatsDuSiteTests et
      # PictogrammesTests touchent aussi des composants et la navigation de l'iPhone.
      - path: CoproFirstTests/TexteDuSiteTests.swift
      - path: CoproFirstTests/MesuresTests.swift
      - path: CoproFirstTests/AdresseInstallationTests.swift
      # Les avis et la licence des paquets, DANS l'app construite (#320).
      - path: CoproFirstTests/ComposantsTiersTests.swift
      # Ce qui n'existe que sur l'Apple TV.
      - path: CoproFirstTVTests
    dependencies:
      - target: CoproFirstTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.coprofirst.app.tv.tests
        GENERATE_INFOPLIST_FILE: "YES"
        # L'app s'appelle CoproFirst.app, pas du nom de sa cible : XcodeGen déduirait
        # « CoproFirstTV.app » et le test ne trouverait pas son hôte.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/CoproFirst.app/CoproFirst
        BUNDLE_LOADER: $(TEST_HOST)
  # L'Apple Watch (#226) : la cloche de la dernière résidence ouverte, en LECTURE seule
  # (jeton de montre, coprofirst#2771). Comme l'écran de hall, elle compile les MÊMES
  # fichiers que l'iPhone, nommément ; ce qui est propre à iOS s'isole et s'exclut ici.
  CoproFirstWatch:
    type: application
    platform: watchOS
    sources:
      - path: CoproFirstWatch
      - path: CoproFirst/Charte
        excludes:
          # Pas de barre de navigation à grands titres au poignet.
          - ApparenceNavigation.swift
          # Les onglets des pages du site : la navigation de l'iPhone.
          - OngletsDuSite.swift
          # La couleur qui suit le thème : la montre est toujours en sombre (CouleurMontre.swift).
          - CouleurDuTheme.swift
      - path: CoproFirst/Commun/Texte
      # L'alerte servie et ses libellés : ceux de la cloche de l'iPhone.
      - path: CoproFirst/Fonctions/Notifications/NotificationRecue.swift
      - path: CoproFirst/Fonctions/Notifications/TextesNotifications.swift
      - path: CoproFirst/Fonctions/Notifications/BoiteSimulee.swift
      # L'icône de chaque type d'alerte, publiée par coprofirst#2802.
      - path: CoproFirst/Fonctions/Notifications/TypeNotification.swift
      - path: CoproFirst/Fonctions/Notifications/Genere/TypesNotification.swift
      # La liaison avec l'iPhone (#226) : le message, écrit une fois pour les deux côtés, et
      # le coffre sans invite de l'app (`CoffreTrousseau`), celui de l'iPhone et de l'Apple TV.
      - path: CoproFirst/Fonctions/Notifications/Montre/MessageLiaison.swift
      - path: CoproFirst/Session/CoffreDuCompte.swift
      # Le hors ligne (#226, lot 3) : la durée de garde et le libellé de l'iPhone (#101).
      - path: CoproFirst/Session/LectureGardee/HorsLigne.swift
    dependencies:
      # Le client sous son nom de montre (#324, Paquets/ClientAPI/Package.swift).
      - package: ClientAPI
        product: ClientAPIMontre
      # Le widget de la pile et du cadran (#226, lot 3), embarqué dans l'app montre.
      - target: CoproFirstWatchWidget
    # L'App Group que l'app partage avec son widget : le résumé de la cloche, des nombres
    # seulement (`PartageDuResume`). Enregistré par Philippe le 18/11/2026 ; la signature
    # automatique l'attache à l'App ID de la montre à la première archive.
    entitlements:
      path: CoproFirstWatch/CoproFirstWatch.entitlements
      properties:
        com.apple.security.application-groups: [group.fr.coprofirst.app]
    info:
      path: CoproFirstWatch/Info.plist
      properties:
        CFBundleDisplayName: CoproFirst
        CFBundleDevelopmentRegion: fr
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [fr]
        ITSAppUsesNonExemptEncryption: false
        # Une app montre autonome dans son paquet, compagne de l'app iPhone.
        WKApplication: true
        WKCompanionAppBundleIdentifier: fr.coprofirst.app
        # Livrée DÉPENDANTE de l'iPhone, comme la montre Wear OS (`standalone=false`) : elle ne
        # sert à rien sans l'app iPhone qui la relie. En Debug seulement, l'étape ci-dessous la
        # déclare indépendante.
        WKRunsIndependentlyOfCompanionApp: false
    # Au simulateur Apple Watch, aucun iPhone jumelé : watchOS oubliait l'app montre
    # « dépendante » d'un compagnon absent — un lancement sur cinq ou six échouait, « Application
    # info provider returned nil » (poste, 17/11/2026, #226). En Debug seulement (simulateur,
    # tests), l'app se déclare indépendante ; une archive Release reste dépendante.
    postBuildScripts:
      - name: Montre indépendante en Debug (simulateur sans iPhone)
        basedOnDependencyAnalysis: false
        # L'Info.plist CONSTRUIT en entrée : l'étape passe après son traitement, qui l'écrasait.
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          if [ "$CONFIGURATION" = Debug ]; then
            /usr/libexec/PlistBuddy -c "Set :WKRunsIndependentlyOfCompanionApp true" \
              "$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          fi
    settings:
      base:
        # L'identifiant d'une app montre se dérive de celui de l'iPhone (FIGÉ).
        PRODUCT_BUNDLE_IDENTIFIER: fr.coprofirst.app.watchkitapp
        # Le module s'appelle CoproFirst, comme sur l'iPhone et l'Apple TV : les tests du code
        # partagé (`@testable import CoproFirst`) se rejouent ici sans un mot de changé.
        PRODUCT_NAME: CoproFirst
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: "NO"
      groups: [clientMontre]
  # Le widget de l'Apple Watch (#226, lot 3) : il ne lit que le résumé que l'app écrit dans
  # l'App Group — ni réseau, ni jeton. Il compile nommément ce qu'il dit et dessine.
  CoproFirstWatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - path: CoproFirstWatchWidget
      - path: CoproFirstWatch/Widget/ResumeCloche.swift
      - path: CoproFirstWatch/TextesMontre.swift
      - path: CoproFirstWatch/MiseMontre.swift
      - path: CoproFirstWatch/CouleurMontre.swift
      - path: CoproFirst/Charte
        excludes:
          - ApparenceNavigation.swift
          - OngletsDuSite.swift
          - CouleurDuTheme.swift
      - path: CoproFirst/Commun/Texte
      # Le logo de CoproFirst (sa licence, REUSE.toml), dans le catalogue de l'iPhone.
      - path: CoproFirst/Ressources/Assets.xcassets
    entitlements:
      path: CoproFirstWatchWidget/CoproFirstWatchWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.fr.coprofirst.app]
    info:
      path: CoproFirstWatchWidget/Info.plist
      properties:
        CFBundleDisplayName: CoproFirst
        CFBundleDevelopmentRegion: fr
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [fr]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.coprofirst.app.watchkitapp.widget
        PRODUCT_NAME: CoproFirstWatchWidget
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: "NO"
        # Le catalogue de l'iPhone porte son icône d'app : le widget n'en a pas.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
  # Les tests de la montre, et ceux du code PARTAGÉ rejoués sur watchOS — nommément.
  CoproFirstWatchTests:
    type: bundle.unit-test
    platform: watchOS
    sources:
      - path: CoproFirstWatchTests
      - path: CoproFirstTests/TexteDuSiteTests.swift
      - path: CoproFirstTests/MesuresTests.swift
      - path: CoproFirstTests/FormatsRelatifTests.swift
    dependencies:
      - target: CoproFirstWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.coprofirst.app.watchkitapp.tests
        GENERATE_INFOPLIST_FILE: "YES"
        # L'app s'appelle CoproFirst.app (voir CoproFirstWatch), pas du nom de sa cible.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/CoproFirst.app/CoproFirst
        BUNDLE_LOADER: $(TEST_HOST)
      groups: [clientMontre]
  # L'interface de la montre (#226), sur ses aides d'attente communes avec l'iPhone.
  CoproFirstWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources:
      - path: CoproFirstWatchUITests
      - path: CoproFirstUITests/Attente.swift
    dependencies:
      - target: CoproFirstWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.coprofirst.app.watchkitapp.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: CoproFirstWatch
schemes:
  CoproFirst:
    build:
      targets:
        CoproFirst: all
    run:
      config: Debug
    test:
      config: Debug
      language: fr
      region: FR
      targets:
        - CoproFirstTests
        - CoproFirstUITests
  CoproFirstTV:
    build:
      targets:
        CoproFirstTV: all
    run:
      config: Debug
    test:
      config: Debug
      language: fr
      region: FR
      targets:
        - CoproFirstTVTests
  CoproFirstWatch:
    build:
      targets:
        CoproFirstWatch: all
    run:
      config: Debug
    test:
      config: Debug
      language: fr
      region: FR
      targets:
        - CoproFirstWatchTests
        - CoproFirstWatchUITests
